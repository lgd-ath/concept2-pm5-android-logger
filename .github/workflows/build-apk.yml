name: Build Concept2 PM5 Logger APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: concept2-pm5-stroke-logger
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Concept2 PM5 Stroke Logger (Latest Build)"
          body: |
            ### Concept2 PM5 Android Stroke-by-Stroke Logger
            Automated build for Samsung Galaxy S25+ and modern Android devices (Android 8.0 - 15).
            
            #### How to Install on your Phone:
            1. Download `concept2-stroke-logger.apk` directly on your phone (or save to Google Drive).
            2. Tap the downloaded file and select **Install**.
            3. Connect your phone to your Concept2 PM5 using a USB-C to USB-B OTG cable.
            4. Start row and capture full stroke-by-stroke force curves!
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
